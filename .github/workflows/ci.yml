name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   

jobs:
  tests:
    name: Lint + Unit / API / UI / Integration / Negative / Eval-harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run offline test suite (fails the build on any failure or coverage < 95%)
        run: >
          pytest -v --cov --cov-report=xml --cov-report=term-missing
          --cov-fail-under=95 --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/junit.xml
            coverage.xml

  llm-regression:
    name: Live LLM regression eval (Groq)
    runs-on: ubuntu-latest
    needs: tests
    
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RUN_LIVE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Skip notice when secret is missing
        if: env.GROQ_API_KEY == ''
        run: echo "::warning::GROQ_API_KEY secret not set - live LLM evals skipped"
      - name: Run live evals and compare against baseline
        if: env.GROQ_API_KEY != ''
        run: python -m evals.run
      - uses: actions/upload-artifact@v4
        if: always() && env.GROQ_API_KEY != ''
        with:
          name: llm-eval-report
          path: evals/results/latest.json
