[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers -m "not live"
markers =
    unit: isolated tests of a single module (no network)
    ui: Streamlit UI driven through streamlit.testing AppTest
    api: FastAPI endpoint tests via TestClient
    integration: multi-module workflows with only external services stubbed
    negative: failure scenarios and invalid input
    genai: GenAI evaluation tests (offline harness checks)
    live: calls the real Groq LLM (needs GROQ_API_KEY and RUN_LIVE_LLM=1)
